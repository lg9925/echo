# Echo API — nginx vhost (reverse proxy to the Node/Hono backend)
# File: /etc/nginx/sites-available/api.echo.helloworldhub.xyz.conf
# Symlink: /etc/nginx/sites-enabled/api.echo.helloworldhub.xyz.conf
#
# The backend (echo-server) listens on 127.0.0.1:8787 (systemd). This vhost
# terminates TLS and proxies to it. CORS is handled by the app (Hono cors()),
# so nothing CORS-related is needed here.
#
# SSL cert path is what `certbot --nginx -d api.echo.helloworldhub.xyz` writes.

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.echo.helloworldhub.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.echo.helloworldhub.xyz;

    ssl_certificate     /etc/letsencrypt/live/api.echo.helloworldhub.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.echo.helloworldhub.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Requests are tiny JSON; responses can be a few hundred KB (TTS mp3).
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM completions can take 10-30s — don't cut them off.
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # TTS returns binary; let nginx stream it through unbuffered.
        proxy_buffering off;
    }
}
