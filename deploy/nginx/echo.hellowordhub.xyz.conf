# Echo PWA — nginx vhost
# File: /etc/nginx/sites-available/echo.hellowordhub.xyz.conf
# Symlink: /etc/nginx/sites-enabled/echo.hellowordhub.xyz.conf
#
# Serves the static export at /var/www/echo/out/.
# SSL cert path is what `certbot --nginx -d echo.hellowordhub.xyz` writes.

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name echo.hellowordhub.xyz;

    # Let's Encrypt ACME challenge passthrough (in case of manual renew)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name echo.hellowordhub.xyz;

    ssl_certificate     /etc/letsencrypt/live/echo.hellowordhub.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/echo.hellowordhub.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/echo/out;
    index index.html;

    # Charset for Chinese content
    charset utf-8;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # ── Cache policy ──────────────────────────────────────────────

    # Service worker must never be cached at the edge — it controls
    # everything else and a stale SW strands users on old code.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~ ^/(swe-worker-.*|workbox-.*)\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Hashed Next.js static assets — long-lived, immutable.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Manifest + icons — moderate cache.
    location = /manifest.json {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
    location /icons/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Seed JSON — short browser cache; Serwist handles offline / SWR.
    location /seed/ {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # ── HTML routing for static export ────────────────────────────
    # With `trailingSlash: true`, Next emits `/zh/index.html`,
    # `/zh/shadow/de.1/index.html`, etc. Try the URI as-is, then as a
    # directory with index.html, then fall through to 404.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
